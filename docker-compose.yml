services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://healthcare:healthcare@db:5432/healthcare?sslmode=disable
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
